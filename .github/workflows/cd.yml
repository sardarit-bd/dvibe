
name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,DEPLOY_SHA

          script: |
            set -e

            if [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_SHA" ]; then
              echo "DEPLOY_PATH or DEPLOY_SHA is missing"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            echo "Fetching deployment commit..."
            git fetch origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"

            echo "Building Docker image..."
            docker compose -f docker-compose.prod.yml build api

            echo "Synchronizing Prisma schema..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps api ./node_modules/.bin/prisma db push

            echo "Starting DVIBE API..."
            docker compose -f docker-compose.prod.yml up -d --no-build --no-deps api

            echo "Waiting for API health..."
            i=1
            while [ "$i" -le 30 ]; do
              if docker exec dvibe-api node -e 'fetch("http://127.0.0.1:5000/").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' >/dev/null 2>&1; then
                echo "DVIBE API is healthy!"
                docker compose -f docker-compose.prod.yml ps
                exit 0
              fi

              sleep 2
              i=$((i + 1))
            done

            echo "DVIBE API health check failed"
            docker compose -f docker-compose.prod.yml ps
            docker logs --tail 100 dvibe-api
            exit 1
